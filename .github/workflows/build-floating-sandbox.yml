name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version
          em++ --version

          echo
          echo "=== CMake ==="
          cmake --version

          echo
          echo "=== Ninja ==="
          ninja --version

      - name: Download official Floating Sandbox
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "Floating Sandbox commit:"
          git rev-parse HEAD

      - name: Download PicoJSON
        shell: bash
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

      - name: Build Emscripten image libraries
        shell: bash
        run: |
          set -e

          echo "Building zlib..."
          embuilder build zlib

          echo
          echo "Building libjpeg..."
          embuilder build libjpeg

          echo
          echo "Building libpng..."
          embuilder build libpng

      - name: Locate Emscripten image libraries
        shell: bash
        run: |
          set -e

          SYSROOT="$(emcc --print-sysroot)"

          echo "Emscripten sysroot:"
          echo "$SYSROOT"

          echo
          echo "Searching for JPEG..."
          JPEG_LIB="$(find "$SYSROOT" -type f \( \
            -name 'libjpeg.a' -o \
            -name 'libjpeg.so' \
          \) | head -n 1)"

          if [ -z "$JPEG_LIB" ]; then
            echo "JPEG library was not found."
            exit 1
          fi

          echo "JPEG_LIB=$JPEG_LIB"

          echo
          echo "Searching for PNG..."
          PNG_LIB="$(find "$SYSROOT" -type f \( \
            -name 'libpng16.a' -o \
            -name 'libpng.a' \
            \) | head -n 1)"

          if [ -z "$PNG_LIB" ]; then
            echo "PNG library was not found."
            exit 1
          fi

          echo "PNG_LIB=$PNG_LIB"

          echo
          echo "Searching for ZLIB..."
          ZLIB_LIB="$(find "$SYSROOT" -type f \( \
            -name 'libz.a' -o \
            -name 'libz.so' \
          \) | head -n 1)"

          if [ -z "$ZLIB_LIB" ]; then
            echo "ZLIB library was not found."
            exit 1
          fi

          echo "ZLIB_LIB=$ZLIB_LIB"

          echo
          echo "Saving library paths..."

          {
            echo "JPEG_LIB=$JPEG_LIB"
            echo "PNG_LIB=$PNG_LIB"
            echo "ZLIB_LIB=$ZLIB_LIB"
            echo "EMSYSROOT=$SYSROOT"
          } >> "$GITHUB_ENV"

      - name: Create browser settings
        shell: bash
        run: |
          set -e

          cat > Floating-Sandbox/UserSettings.cmake <<'EOF'
          # Browser/Emscripten build settings

          set(FS_BUILD_BENCHMARKS OFF CACHE BOOL "" FORCE)
          set(FS_USE_STATIC_LIBS ON CACHE BOOL "" FORCE)
          EOF

          cat Floating-Sandbox/UserSettings.cmake

      - name: Configure with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo "========================================"
          echo "Starting Emscripten CMake configuration"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DZLIB_LIBRARY="${ZLIB_LIB}" \
            -DZLIB_INCLUDE_DIR="${EMSYSROOT}/include" \
            -DJPEG_LIBRARY="${JPEG_LIB}" \
            -DJPEG_INCLUDE_DIR="${EMSYSROOT}/include" \
            -DPNG_LIBRARY="${PNG_LIB}" \
            -DPNG_PNG_INCLUDE_DIR="${EMSYSROOT}/include" \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 configure.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            configure.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Starting Floating Sandbox build"
          echo "========================================"

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 build.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference|unsupported" \
            build.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Search for generated WebAssembly
        if: always()
        shell: bash
        run: |
          echo "===== WASM ====="
          find . -type f -name "*.wasm" -print

          echo
          echo "===== JavaScript ====="
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -print | head -250

          echo
          echo "===== DATA ====="
          find . -type f -name "*.data" -print

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-build-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
            Floating-Sandbox/UserSettings.cmake
          if-no-files-found: ignore
