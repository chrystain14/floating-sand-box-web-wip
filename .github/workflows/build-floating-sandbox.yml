name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version
          em++ --version

          echo
          echo "=== CMake ==="
          cmake --version

          echo
          echo "=== Ninja ==="
          ninja --version

      - name: Download official Floating Sandbox
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "Official Floating Sandbox source:"
          git rev-parse HEAD

      - name: Download PicoJSON
        shell: bash
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

      - name: Prepare Emscripten zlib
        shell: bash
        run: |
          set -e

          echo "Building the Emscripten zlib port..."

          embuilder build zlib

          echo
          echo "Emscripten cache:"
          emcc --show-ports

      - name: Create browser build settings
        shell: bash
        run: |
          set -e

          cat > Floating-Sandbox/UserSettings.cmake <<'EOF'
          # Browser/Emscripten build settings

          # Do not build optional Google Benchmark.
          set(FS_BUILD_BENCHMARKS OFF CACHE BOOL "" FORCE)

          # Emscripten supplies zlib.
          set(ZLIB_USE_STATIC_LIBS ON CACHE BOOL "" FORCE)

          # Tell CMake to prefer the Emscripten sysroot.
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)

          # Emscripten browser build.
          set(FS_BROWSER_BUILD ON CACHE BOOL "" FORCE)
          EOF

          echo "Created UserSettings.cmake:"
          cat Floating-Sandbox/UserSettings.cmake

      - name: Configure with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo "========================================"
          echo "Starting Emscripten CMake configuration"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1" \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 configure.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            configure.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Starting Floating Sandbox Emscripten build"
          echo "========================================"

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 build.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference|unsupported" \
            build.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Find generated WebAssembly
        if: always()
        shell: bash
        run: |
          echo "===== WASM ====="
          find . -type f -name "*.wasm" -print

          echo
          echo "===== DATA ====="
          find . -type f -name "*.data" -print

          echo
          echo "===== JavaScript ====="
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -print \
            | head -250

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-build-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
            Floating-Sandbox/UserSettings.cmake
          if-no-files-found: ignore
