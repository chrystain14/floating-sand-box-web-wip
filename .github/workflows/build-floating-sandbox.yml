name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify Emscripten
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version
          em++ --version

          echo
          echo "=== CMake ==="
          cmake --version

          echo
          echo "=== Ninja ==="
          ninja --version

      - name: Download official Floating Sandbox
        shell: bash
        run: |
          set -e

          rm -rf Floating-Sandbox

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo
          echo "=== Official Floating Sandbox commit ==="
          git rev-parse HEAD

      - name: Download PicoJSON
        shell: bash
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

          echo "PicoJSON:"
          ls -lh third_party/picojson/picojson.h

      - name: Prepare Emscripten image libraries
        shell: bash
        run: |
          set -e

          echo "Preparing zlib..."
          embuilder build zlib

          echo
          echo "Preparing libjpeg..."
          embuilder build libjpeg

          echo
          echo "Preparing libpng..."
          embuilder build libpng

      - name: Inspect repository structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "TOP LEVEL DIRECTORIES"
          echo "========================================"

          find Floating-Sandbox \
            -maxdepth 2 \
            -type d \
            -print \
            | sort || true

          echo
          echo "========================================"
          echo "CMAKE FILES"
          echo "========================================"

          find Floating-Sandbox \
            -type f \
            \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -print \
            | sort || true

      - name: Locate GameLib
        shell: bash
        run: |
          set -e

          echo "Searching for GameLib..."

          GAMELIB_DIR=""

          if [ -d "Floating-Sandbox/GameLib" ]; then
            GAMELIB_DIR="Floating-Sandbox/GameLib"
          elif [ -d "Floating-Sandbox/Sources/GameLib" ]; then
            GAMELIB_DIR="Floating-Sandbox/Sources/GameLib"
          else
            while IFS= read -r dir; do
              GAMELIB_DIR="$dir"
              break
            done < <(
              find Floating-Sandbox \
                -type d \
                -name "GameLib" \
                -print
            )
          fi

          if [ -z "$GAMELIB_DIR" ]; then
            echo "GameLib directory was not found."

            echo
            echo "Directories containing 'Game':"

            find Floating-Sandbox \
              -type d \
              -iname "*game*" \
              -print \
              | sort || true

            exit 1
          fi

          echo "GameLib found at:"
          echo "$GAMELIB_DIR"

          echo "GAMELIB_DIR=$GAMELIB_DIR" >> "$GITHUB_ENV"

      - name: Inspect GameLib
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GAMELIB"
          echo "========================================"

          echo "Directory:"
          echo "$GAMELIB_DIR"

          echo
          echo "Files:"

          find "$GAMELIB_DIR" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort || true

          echo
          echo "Dependency references:"

          grep -RniE \
            'wxWidgets|SFML|OpenGL|OpenAL|zlib|jpeg|png|pthread|SSE2|NEON|filesystem' \
            "$GAMELIB_DIR" \
            --include='*.cpp' \
            --include='*.h' \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            || true

      - name: Inspect top-level targets
        shell: bash
        run: |
          set -e

          echo "Searching for CMake targets..."

          grep -RniE \
            'add_library|add_executable|target_link_libraries|target_include_directories' \
            Floating-Sandbox \
            --include='CMakeLists.txt' \
            || true

      - name: Configure with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo
          echo "========================================"
          echo "STARTING EMSCRIPTEN CONFIGURATION"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 300 LINES =========="

          if [ -f configure.log ]; then
            tail -n 300 configure.log || true
          fi

          echo
          echo "========== IMPORTANT ERRORS =========="

          if [ -f configure.log ]; then
            grep -n -i \
              -E "error|failed|not found|could not find|unsupported|fatal" \
              configure.log \
              | tail -n 200 || true
          fi

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          echo
          echo "========================================"
          echo "STARTING EMSCRIPTEN BUILD"
          echo "========================================"

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 300 LINES =========="

          if [ -f build.log ]; then
            tail -n 300 build.log || true
          fi

          echo
          echo "========== IMPORTANT ERRORS =========="

          if [ -f build.log ]; then
            grep -n -i \
              -E "error|failed|not found|fatal|undefined reference|unsupported" \
              build.log \
              | tail -n 200 || true
          fi

          exit $RESULT

      - name: Search for generated WebAssembly
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "WASM FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.wasm" \
            -print || true

          echo
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.data" \
            -print || true

          echo
          echo "========================================"
          echo "JAVASCRIPT FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.js" \
            -not -path "./.git/*" \
            -print \
            | sort || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-web-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
          if-no-files-found: ignore
