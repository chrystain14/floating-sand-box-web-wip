name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify tools
        run: |
          set -e
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Download official Floating Sandbox
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "Floating Sandbox commit:"
          git rev-parse HEAD

      - name: Download PicoJSON
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

          echo "PicoJSON downloaded:"
          ls -lh third_party/picojson/picojson.h

      - name: Inspect PicoJSON finder
        run: |
          echo "===== Floating Sandbox FindPicoJSON.cmake ====="

          sed -n '1,160p' \
            Floating-Sandbox/cmake/FindPicoJSON.cmake

      - name: Configure with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo "========================================"
          echo "Starting Emscripten CMake configuration"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 200 LINES =========="
          tail -n 200 configure.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            configure.log \
            | tail -n 120 || true

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Starting Floating Sandbox Emscripten build"
          echo "========================================"

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 200 LINES =========="
          tail -n 200 build.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference" \
            build.log \
            | tail -n 120 || true

          exit $RESULT

      - name: Find WebAssembly output
        if: always()
        shell: bash
        run: |
          echo "===== WASM ====="
          find . -type f -name "*.wasm" -print

          echo
          echo "===== JavaScript ====="
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -print \
            | head -250

          echo
          echo "===== DATA ====="
          find . -type f -name "*.data" -print

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-build-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
          if-no-files-found: ignore
