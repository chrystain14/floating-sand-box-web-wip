name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify toolchain
        shell: bash
        run: |
          set -e

          echo "=== Emscripten ==="
          emcc --version
          em++ --version

          echo
          echo "=== CMake ==="
          cmake --version

          echo
          echo "=== Ninja ==="
          ninja --version

      - name: Download official Floating Sandbox
        shell: bash
        run: |
          set -e

          rm -rf Floating-Sandbox

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "=== Upstream commit ==="
          git rev-parse HEAD

      - name: Download PicoJSON
        shell: bash
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

      - name: Prepare Emscripten image libraries
        shell: bash
        run: |
          set -e

          embuilder build zlib
          embuilder build libjpeg
          embuilder build libpng

      - name: Inspect actual source layout
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "DIRECTORIES"
          echo "========================================"

          find Floating-Sandbox \
            -maxdepth 2 \
            -type d \
            -print \
            | sort || true

          echo
          echo "========================================"
          echo "CMAKE FILES"
          echo "========================================"

          find Floating-Sandbox \
            -type f \
            \( -name "CMakeLists.txt" -o -name "*.cmake" \) \
            -print \
            | sort || true

          echo
          echo "========================================"
          echo "SOURCES/GAME"
          echo "========================================"

          if [ -d "Floating-Sandbox/Sources/Game" ]; then
            find Floating-Sandbox/Sources/Game \
              -maxdepth 2 \
              -type f \
              -print \
              | sort || true
          else
            echo "Sources/Game does not exist."
          fi

      - name: Inspect Game source dependencies
        shell: bash
        run: |
          set -e

          if [ -d "Floating-Sandbox/Sources/Game" ]; then

            echo "========================================"
            echo "GAME DEPENDENCIES"
            echo "========================================"

            grep -RniE \
              'wxWidgets|wx/|SFML|OpenGL|OpenAL|GL/|pthread|filesystem|SSE2|NEON|Emscripten' \
              Floating-Sandbox/Sources/Game \
              --include='*.cpp' \
              --include='*.h' \
              --include='CMakeLists.txt' \
              2>/dev/null \
              || true

            echo
            echo "========================================"
            echo "GAME SOURCE COUNT"
            echo "========================================"

            find Floating-Sandbox/Sources/Game \
              -type f \
              \( -name '*.cpp' -o -name '*.h' \) \
              -print \
              | wc -l

          fi

      - name: Inspect top-level build targets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "TARGET DEFINITIONS"
          echo "========================================"

          grep -RniE \
            'add_library|add_executable|target_link_libraries|target_sources' \
            Floating-Sandbox \
            --include='CMakeLists.txt' \
            | sort || true

      - name: Configure native project with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo "========================================"
          echo "STARTING EMSCRIPTEN CONFIGURATION"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="

          tail -n 250 configure.log || true

          echo
          echo "========== IMPORTANT ERRORS =========="

          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            configure.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "STARTING EMSCRIPTEN BUILD"
          echo "========================================"

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="

          tail -n 250 build.log || true

          echo
          echo "========== IMPORTANT ERRORS =========="

          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference|unsupported" \
            build.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Search for WebAssembly output
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "WASM FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.wasm" \
            -print || true

          echo
          echo "========================================"
          echo "DATA FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.data" \
            -print || true

          echo
          echo "========================================"
          echo "JAVASCRIPT FILES"
          echo "========================================"

          find . \
            -type f \
            -name "*.js" \
            -not -path "./.git/*" \
            -print \
            | sort || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-web-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
          if-no-files-found: ignore
