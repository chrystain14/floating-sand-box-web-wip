name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify Emscripten
        run: |
          set -e
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Download official Floating Sandbox
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "Official source downloaded."
          echo "Commit:"
          git rev-parse HEAD

      - name: Inspect source
        run: |
          cd Floating-Sandbox

          echo "=== Top-level files ==="
          find . -maxdepth 2 -type f | sort | head -250

          echo
          echo "=== CMake files ==="
          find . -name "CMakeLists.txt" -type f | sort

      - name: Configure with Emscripten
        shell: bash
        run: |
          set +e

          rm -rf build-web
          mkdir -p build-web

          echo "========================================"
          echo "Starting Emscripten CMake configuration"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox \
            -B build-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            > configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 150 LINES =========="
          tail -n 150 configure.log

          echo
          echo "========== CMAKE ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            configure.log \
            | tail -n 100 || true

          exit $RESULT

      - name: Build with Emscripten
        if: success()
        shell: bash
        run: |
          set +e

          cmake \
            --build build-web \
            --parallel 2 \
            > build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 150 LINES =========="
          tail -n 150 build.log

          echo
          echo "========== BUILD ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference" \
            build.log \
            | tail -n 100 || true

          exit $RESULT

      - name: Find generated files
        if: always()
        run: |
          echo "=== WASM ==="
          find . -type f -name "*.wasm" -print

          echo
          echo "=== JavaScript ==="
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -print \
            | head -200

          echo
          echo "=== DATA ==="
          find . -type f -name "*.data" -print

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-build-diagnostics
          path: |
            configure.log
            build.log
            build-web/**
          if-no-files-found: ignore
