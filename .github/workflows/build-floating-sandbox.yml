name: Floating Sandbox Web Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Check tools
        run: |
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Download Floating Sandbox
        run: |
          git clone --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

      - name: Show source
        run: |
          cd Floating-Sandbox

          echo "Floating Sandbox source downloaded."
          echo

          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "CMake files:"
          find Sources -maxdepth 3 -name CMakeLists.txt | sort

      - name: Test Emscripten CMake
        run: |
          cd Floating-Sandbox

          mkdir -p emscripten-test
          cd emscripten-test

          emcmake cmake ..

      - name: Show CMake result
        if: always()
        run: |
          echo "===== CMake cache ====="

          if [ -f Floating-Sandbox/emscripten-test/CMakeCache.txt ]; then
            grep -E "CMAKE_(C|CXX)_COMPILER|CMAKE_SYSTEM_NAME" \
              Floating-Sandbox/emscripten-test/CMakeCache.txt || true
          fi

          echo
          echo "===== Generated files ====="

          find Floating-Sandbox/emscripten-test \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      - name: Upload CMake diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-cmake-test
          path: |
            Floating-Sandbox/emscripten-test/**
          if-no-files-found: ignore
