name: Floating Sandbox Web Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify tools
        run: |
          set -e
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Download official Floating Sandbox
        run: |
          set -e

          git clone \
            --depth 1 \
            https://github.com/GabrieleGiuseppini/Floating-Sandbox.git \
            Floating-Sandbox

          cd Floating-Sandbox

          echo "=== Floating Sandbox commit ==="
          git rev-parse HEAD

      - name: Download PicoJSON
        run: |
          set -e

          mkdir -p third_party/picojson

          curl -L \
            --fail \
            --retry 3 \
            https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h \
            -o third_party/picojson/picojson.h

          test -s third_party/picojson/picojson.h

      - name: Prepare Emscripten image libraries
        run: |
          set -e

          embuilder build zlib
          embuilder build libjpeg
          embuilder build libpng

      - name: Inspect upstream CMake
        run: |
          set -e

          echo "=== Top-level CMake ==="
          sed -n '1,180p' Floating-Sandbox/CMakeLists.txt

          echo
          echo "=== GameLib CMake ==="
          sed -n '1,220p' Floating-Sandbox/GameLib/CMakeLists.txt

          echo
          echo "=== FloatingSandbox CMake ==="
          sed -n '1,220p' Floating-Sandbox/FloatingSandbox/CMakeLists.txt

      - name: Find desktop-only dependencies
        run: |
          echo "=== wxWidgets references ==="
          grep -Rni "wxWidgets" Floating-Sandbox \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            || true

          echo
          echo "=== SFML references ==="
          grep -Rni "SFML" Floating-Sandbox \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            || true

          echo
          echo "=== OpenGL references ==="
          grep -Rni "OpenGL" Floating-Sandbox \
            --include='CMakeLists.txt' \
            --include='*.cmake' \
            || true

      - name: Attempt GameLib-only Emscripten configuration
        shell: bash
        run: |
          set +e

          rm -rf gamelib-web
          mkdir -p gamelib-web

          echo "========================================"
          echo "Attempting GameLib-only WebAssembly build"
          echo "========================================"

          emcmake cmake \
            -S Floating-Sandbox/GameLib \
            -B gamelib-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICOJSON_INCLUDE_DIRS="${GITHUB_WORKSPACE}/third_party/picojson" \
            -DZLIB_USE_STATIC_LIBS=ON \
            -DCMAKE_C_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            -DCMAKE_CXX_FLAGS="-sUSE_ZLIB=1 -sUSE_LIBJPEG=1 -sUSE_LIBPNG=1" \
            > gamelib-configure.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "GAMELIB CONFIGURE EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 gamelib-configure.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|could not find|unsupported|fatal" \
            gamelib-configure.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Build GameLib
        if: success()
        shell: bash
        run: |
          set +e

          cmake \
            --build gamelib-web \
            --parallel 2 \
            > gamelib-build.log 2>&1

          RESULT=$?

          echo
          echo "========================================"
          echo "GAMELIB BUILD EXIT CODE: $RESULT"
          echo "========================================"

          echo
          echo "========== LAST 250 LINES =========="
          tail -n 250 gamelib-build.log

          echo
          echo "========== IMPORTANT ERRORS =========="
          grep -n -i \
            -E "error|failed|not found|fatal|undefined reference|unsupported" \
            gamelib-build.log \
            | tail -n 150 || true

          exit $RESULT

      - name: Search for WebAssembly output
        if: always()
        run: |
          echo "=== WASM ==="
          find . -type f -name "*.wasm" -print

          echo
          echo "=== JavaScript ==="
          find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -print | head -250

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-web-diagnostics
          path: |
            gamelib-configure.log
            gamelib-build.log
            gamelib-web/**
          if-no-files-found: ignore
