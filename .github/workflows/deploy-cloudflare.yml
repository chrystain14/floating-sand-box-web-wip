name: Deploy Floating Sandbox to Cloudflare

on:
  workflow_run:
    workflows: ["Floating Sandbox Web Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser build artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: floating-sandbox-browser-build
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cloudflare files
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -la

          echo
          echo "=== public ==="
          find public -maxdepth 4 -type f -print | sort

          test -f worker.js
          test -f wrangler.toml
          test -f public/floating-sandbox/index.html

          echo
          echo "=== Required files ==="
          find public/floating-sandbox -maxdepth 1 -type f \( -name '*.js' -o -name '*.wasm' -o -name '*.data' \) -print | sort

          test "$(find public/floating-sandbox -maxdepth 1 -type f -name '*.js' | wc -l)" -ge 1
          test "$(find public/floating-sandbox -maxdepth 1 -type f -name '*.wasm' | wc -l)" -ge 1

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
