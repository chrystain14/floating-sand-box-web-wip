name: Deploy Floating Sandbox to Cloudflare

on:
  workflow_run:
    workflows: ["Floating Sandbox Web Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser build artifact
        uses: actions/download-artifact@v4
        with:
          name: floating-sandbox-browser-build
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Cloudflare assets
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public/floating-sandbox

          echo "=== Artifact ==="
          find artifact -maxdepth 8 -type f -print | sort

          # The artifact may already contain public/floating-sandbox,
          # or it may contain the browser files directly.
          if [ -d "artifact/public/floating-sandbox" ]; then
            cp -a artifact/public/floating-sandbox/. public/floating-sandbox/
          elif [ -d "artifact/floating-sandbox" ]; then
            cp -a artifact/floating-sandbox/. public/floating-sandbox/
          else
            cp -a artifact/. public/floating-sandbox/
          fi

          echo "=== Staged assets ==="
          find public -maxdepth 8 -type f -print | sort

      - name: Normalize browser filenames
        shell: bash
        run: |
          set -e
          cd public/floating-sandbox

          # Keep the build's real filenames, but normalize the common
          # UUID-style uploaded names if they are present.
          html="$(find . -maxdepth 1 -type f -name '*.html' | head -n 1)"
          js="$(find . -maxdepth 1 -type f -name '*.js' | head -n 1)"
          wasm="$(find . -maxdepth 1 -type f -name '*.wasm' | head -n 1)"

          [ -n "$html" ] && [ "$html" != "./index.html" ] && mv "$html" index.html || true

          if [ -n "$js" ] && [ "$js" != "./floating-sandbox-web.js" ]; then
            mv "$js" floating-sandbox-web.js
          fi

          if [ -n "$wasm" ] && [ "$wasm" != "./floating-sandbox-web.wasm" ]; then
            mv "$wasm" floating-sandbox-web.wasm
          fi

      - name: Verify Cloudflare files
        shell: bash
        run: |
          set -e
          echo "=== Final Cloudflare assets ==="
          find public/floating-sandbox -maxdepth 2 -type f -print | sort

          test -f worker.js
          test -f wrangler.toml
          test -f public/floating-sandbox/index.html
          test -f public/floating-sandbox/floating-sandbox-web.js
          test -f public/floating-sandbox/floating-sandbox-web.wasm

          echo "HTML: OK"
          echo "JavaScript: OK"
          echo "WASM: OK"

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
