name: Deploy Floating Sandbox to Cloudflare

on:
  workflow_run:
    workflows: ["Floating Sandbox Web Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: floating-sandbox-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download browser build artifact
        uses: actions/download-artifact@v4
        with:
          name: floating-sandbox-browser-build
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Cloudflare assets
        shell: bash
        run: |
          set -e
          rm -rf public
          mkdir -p public/floating-sandbox
          echo "=== Artifact ==="
          find artifact -maxdepth 8 -type f -print | sort
          if [ -d "artifact/public/floating-sandbox" ]; then
            cp -a artifact/public/floating-sandbox/. public/floating-sandbox/
          elif [ -d "artifact/floating-sandbox" ]; then
            cp -a artifact/floating-sandbox/. public/floating-sandbox/
          else
            cp -a artifact/. public/floating-sandbox/
          fi
          test -f public/floating-sandbox/index.html
          test -f public/floating-sandbox/floating-sandbox-web.js
          test -f public/floating-sandbox/floating-sandbox-web.wasm
          echo "=== Staged assets ==="
          find public -maxdepth 2 -type f -print | sort

      - name: Verify Vercel files in repository
        shell: bash
        run: |
          set -e
          test -f public/index.html
          test -f public/floating-sandbox/index.html
          test -f public/floating-sandbox/floating-sandbox-web.js
          test -f public/floating-sandbox/floating-sandbox-web.wasm
          echo "Repository browser files are present."

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
