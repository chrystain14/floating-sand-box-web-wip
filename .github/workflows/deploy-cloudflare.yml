name: Deploy Floating Sandbox to Cloudflare

on:
  workflow_run:
    workflows: ["Floating Sandbox Web Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser build artifact from completed build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: floating-sandbox-browser-build
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download latest successful browser build artifact for manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow build-floating-sandbox.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "No successful Floating Sandbox Web Build run was found."
            echo "Run the build workflow successfully first."
            exit 1
          fi

          echo "Using successful build run: ${RUN_ID}"

          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name floating-sandbox-browser-build \
            --dir .

      - name: Normalize browser build into Cloudflare public directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public/floating-sandbox

          if [ -d "public/floating-sandbox" ] && [ -f "public/floating-sandbox/index.html" ]; then
            echo "Artifact already contains public/floating-sandbox."
          else
            echo "Searching downloaded artifact for browser files..."

            HTML="$(find . -type f -name 'index.html' -not -path './.git/*' | head -n 1 || true)"
            JS="$(find . -type f -name '*.js' -not -path './.git/*' | grep -v '/node_modules/' | head -n 1 || true)"
            WASM="$(find . -type f -name '*.wasm' -not -path './.git/*' | head -n 1 || true)"

            if [ -z "${HTML}" ] || [ -z "${JS}" ] || [ -z "${WASM}" ]; then
              echo "Could not locate the required HTML, JS, and WASM files in the build artifact."
              echo "=== Files found ==="
              find . -type f -not -path './.git/*' | sort
              exit 1
            fi

            cp "${HTML}" public/floating-sandbox/index.html
            cp "${JS}" public/floating-sandbox/
            cp "${WASM}" public/floating-sandbox/
          fi

      - name: Verify Cloudflare files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository ==="
          pwd
          ls -la

          echo
          echo "=== public ==="
          find public -maxdepth 4 -type f -print | sort

          test -f worker.js
          test -f wrangler.toml
          test -f public/floating-sandbox/index.html

          echo
          echo "=== Required files ==="
          find public/floating-sandbox -maxdepth 1 -type f \( -name '*.js' -o -name '*.wasm' -o -name '*.data' \) -print | sort

          test "$(find public/floating-sandbox -maxdepth 1 -type f -name '*.js' | wc -l)" -ge 1
          test "$(find public/floating-sandbox -maxdepth 1 -type f -name '*.wasm' | wc -l)" -ge 1

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
