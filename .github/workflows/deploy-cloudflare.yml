name: Deploy Floating Sandbox to Cloudflare

on:
  workflow_run:
    workflows: ["Floating Sandbox Web Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download browser build artifact
        uses: actions/download-artifact@v4
        with:
          name: floating-sandbox-browser-build
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Cloudflare files
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -la

          echo
          echo "=== Downloaded files ==="
          find . -maxdepth 5 -type f \
            -not -path './.git/*' \
            | sort

          echo
          echo "=== Cloudflare public assets ==="
          find public -maxdepth 5 -type f -print | sort

          test -f worker.js
          test -f wrangler.toml
          test -f public/floating-sandbox/index.html

          JS_COUNT="$(find public/floating-sandbox -maxdepth 1 -type f -name '*.js' | wc -l)"
          WASM_COUNT="$(find public/floating-sandbox -maxdepth 1 -type f -name '*.wasm' | wc -l)"

          echo "JavaScript files: $JS_COUNT"
          echo "WASM files: $WASM_COUNT"

          test "$JS_COUNT" -ge 1
          test "$WASM_COUNT" -ge 1

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
