name: Floating Sandbox WASM Staging Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - wasm-port-next

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate workflow runner
        run: |
          set -eux
          echo "Workflow YAML parsed successfully."
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          test -f .github/workflows/wasm-port.yml
