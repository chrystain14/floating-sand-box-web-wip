name: Experimental Floating Sandbox WebAssembly Port

on:
  workflow_dispatch:
  push:
    branches: [wasm-port-next]

permissions:
  contents: read

concurrency:
  group: floating-sandbox-wasm-port-next
  cancel-in-progress: true

jobs:
  emscripten-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.12

      - name: Verify Emscripten toolchain
        run: |
          set -eux
          emcc --version
          em++ --version
          command -v emcmake
          emcmake cmake --version
          cmake --version
          echo "EM_SYSROOT=$(emcc -print-sysroot)" >> "$GITHUB_ENV"

      - name: Checkout upstream Floating Sandbox
        run: |
          set -eux
          git clone --depth 1 https://github.com/GabrieleGiuseppini/Floating-Sandbox.git upstream-floating-sandbox

      - name: Install PicoJSON
        run: |
          set -eux
          mkdir -p third-party/picojson/include
          curl -L --fail --retry 3 https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h -o third-party/picojson/include/picojson.h
          test -s third-party/picojson/include/picojson.h

      - name: Build ZLIB for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          emcmake cmake -S zlib-src -B zlib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/zlib-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_BUILD_TESTING=OFF
          cmake --build zlib-build --parallel 2
          cmake --install zlib-build
          test -f zlib-install/include/zlib.h
          test -f zlib-install/lib/libz.a

      - name: Build JPEG for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch 3.1.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git jpeg-src
          emcmake cmake -S jpeg-src -B jpeg-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/jpeg-install" \
            -DENABLE_SHARED=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_SIMD=OFF
          cmake --build jpeg-build --parallel 2
          cmake --install jpeg-build
          test -f jpeg-install/include/jpeglib.h
          test -f jpeg-install/lib/libjpeg.a

      - name: Build PNG for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git png-src
          emcmake cmake -S png-src -B png-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/png-install" \
            -DPNG_SHARED=OFF \
            -DPNG_TESTS=OFF \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a"
          cmake --build png-build --parallel 2
          cmake --install png-build
          test -f png-install/include/png.h
          test -f png-install/lib/libpng16.a

      - name: Build wxWidgets for WebAssembly
        run: |
          set -eux
          git clone --depth 1 https://github.com/ahilss/wxWidgets-wasm.git wxwidgets-src
          cd wxwidgets-src
          git submodule update --init src/jpeg src/zlib src/png src/expat 3rdparty/catch
          test -f src/zlib/zlib.h
          test -f src/png/png.c
          test -f src/expat/expat/lib/expat.h
          cp config.sub src/expat/expat/conftools/config.sub
          cp config.guess src/expat/expat/conftools/config.guess
          chmod +x src/expat/expat/conftools/config.sub src/expat/expat/conftools/config.guess

          export CFLAGS="-I$GITHUB_WORKSPACE/zlib-install/include -I$GITHUB_WORKSPACE/png-install/include"
          export CXXFLAGS="-I$GITHUB_WORKSPACE/zlib-install/include -I$GITHUB_WORKSPACE/png-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/zlib-install/lib -L$GITHUB_WORKSPACE/png-install/lib -sERROR_ON_UNDEFINED_SYMBOLS=0"

          emconfigure ./configure \
            --host=emscripten \
            --prefix="$GITHUB_WORKSPACE/wxwidgets-install" \
            --with-cxx=14 \
            --enable-utf8 \
            --enable-universal \
            --disable-shared \
            --disable-exceptions \
            --disable-richtext \
            --without-libtiff \
            --disable-xlocale \
            --with-zlib=sys \
            --with-libpng=sys

          emmake make -j2
          emmake make install

          WX_CONFIG=$(find "$GITHUB_WORKSPACE/wxwidgets-install" -type f -name 'wx-config*' -print -quit)
          test -n "$WX_CONFIG"
          chmod +x "$WX_CONFIG"
          echo "WX_CONFIG=$WX_CONFIG" >> "$GITHUB_ENV"
          echo "$(dirname "$WX_CONFIG")" >> "$GITHUB_PATH"

      - name: Verify wxWidgets installation
        run: |
          set -eux
          test -n "$WX_CONFIG"
          wx-config --version
          wx-config --cxxflags
          wx-config --libs
          wx-config --libs base,core,html,propgrid,ribbon
          if wx-config --libs base,core,gl >/tmp/wx-gl.txt 2>&1; then
            echo "Unexpected wx-config GL support:"; cat /tmp/wx-gl.txt
          else
            echo "wx-config correctly rejects the unavailable GL component"
          fi

      - name: Prepare Emscripten audio ports
        run: |
          set -eux
          cat > /tmp/wasm-audio-probe.cpp <<'CPP'
          #include <AL/al.h>
          #include <vorbis/vorbisfile.h>
          int main() { return AL_NO_ERROR + ov_clear(nullptr); }
          CPP
          em++ /tmp/wasm-audio-probe.cpp \
            -sUSE_OPENAL=1 \
            -sUSE_OGG=1 \
            -sUSE_VORBIS=1 \
            -o /tmp/wasm-audio-probe.js
          test -s /tmp/wasm-audio-probe.js
          find "$EM_SYSROOT/include" -maxdepth 3 -type f \( -path '*/AL/al.h' -o -path '*/vorbis/vorbisfile.h' \) -print

      - name: Build SFML 2.5.1 for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch 2.5.1 https://github.com/SFML/SFML.git sfml-src

          python3 - <<'PY'
          from pathlib import Path

          cfg = Path("sfml-src/cmake/Config.cmake")
          s = cfg.read_text(encoding="utf-8")
          marker = 'elseif(${CMAKE_SYSTEM_NAME} STREQUAL "Darwin")'
          insert = '''elseif(${CMAKE_SYSTEM_NAME} STREQUAL "Emscripten")\n    set(SFML_OS_UNIX 1)\n    set(SFML_OS_EMSCRIPTEN 1)\n    set(OPENGL_ES 1)\n'''
          assert marker in s
          cfg.write_text(s.replace(marker, insert + marker, 1), encoding="utf-8")

          sysroot = Path("${EM_SYSROOT}")
          mods = Path("sfml-src/cmake/Modules")
          mods.mkdir(parents=True, exist_ok=True)

          (mods / "FindOpenAL.cmake").write_text(f'''set(OPENAL_FOUND TRUE)\nset(OpenAL_FOUND TRUE)\nset(OPENAL_INCLUDE_DIR "{sysroot / 'include'}")\nset(OPENAL_LIBRARY "-lopenal")\n''', encoding="utf-8")
          (mods / "FindVorbis.cmake").write_text(f'''set(VORBIS_FOUND TRUE)\nset(Vorbis_FOUND TRUE)\nset(VORBIS_INCLUDE_DIRS "{sysroot / 'include'}")\nset(VORBIS_LIBRARIES "-lvorbisfile;-lvorbis;-logg")\n''', encoding="utf-8")

          audio = Path("sfml-src/src/SFML/Audio/CMakeLists.txt")
          a = audio.read_text(encoding="utf-8")
          a = a.replace('''set(CODECS_SRC\n    ${SRCROOT}/SoundFileFactory.cpp\n    ${INCROOT}/SoundFileFactory.hpp\n    ${INCROOT}/SoundFileFactory.inl\n    ${INCROOT}/SoundFileReader.hpp\n    ${SRCROOT}/SoundFileReaderFlac.hpp\n    ${SRCROOT}/SoundFileReaderFlac.cpp\n    ${SRCROOT}/SoundFileReaderOgg.hpp\n    ${SRCROOT}/SoundFileReaderOgg.cpp\n    ${SRCROOT}/SoundFileReaderWav.hpp\n    ${SRCROOT}/SoundFileReaderWav.cpp\n    ${INCROOT}/SoundFileWriter.hpp\n    ${SRCROOT}/SoundFileWriterFlac.hpp\n    ${SRCROOT}/SoundFileWriterFlac.cpp\n    ${SRCROOT}/SoundFileWriterOgg.hpp\n    ${SRCROOT}/SoundFileWriterOgg.cpp\n    ${SRCROOT}/SoundFileWriterWav.hpp\n    ${SRCROOT}/SoundFileWriterWav.cpp\n)''', '''if(SFML_OS_EMSCRIPTEN)\n    set(CODECS_SRC\n        ${SRCROOT}/SoundFileFactory.cpp\n        ${INCROOT}/SoundFileFactory.hpp\n        ${INCROOT}/SoundFileFactory.inl\n        ${INCROOT}/SoundFileReader.hpp\n        ${SRCROOT}/SoundFileReaderOgg.hpp\n        ${SRCROOT}/SoundFileReaderOgg.cpp\n        ${SRCROOT}/SoundFileReaderWav.hpp\n        ${SRCROOT}/SoundFileReaderWav.cpp\n        ${INCROOT}/SoundFileWriter.hpp\n        ${SRCROOT}/SoundFileWriterOgg.hpp\n        ${SRCROOT}/SoundFileWriterOgg.cpp\n        ${SRCROOT}/SoundFileWriterWav.hpp\n        ${SRCROOT}/SoundFileWriterWav.cpp\n    )\nelse()\n    set(CODECS_SRC\n        ${SRCROOT}/SoundFileFactory.cpp\n        ${INCROOT}/SoundFileFactory.hpp\n        ${INCROOT}/SoundFileFactory.inl\n        ${INCROOT}/SoundFileReader.hpp\n        ${SRCROOT}/SoundFileReaderFlac.hpp\n        ${SRCROOT}/SoundFileReaderFlac.cpp\n        ${SRCROOT}/SoundFileReaderOgg.hpp\n        ${SRCROOT}/SoundFileReaderOgg.cpp\n        ${SRCROOT}/SoundFileReaderWav.hpp\n        ${SRCROOT}/SoundFileReaderWav.cpp\n        ${INCROOT}/SoundFileWriter.hpp\n        ${SRCROOT}/SoundFileWriterFlac.hpp\n        ${SRCROOT}/SoundFileWriterFlac.cpp\n        ${SRCROOT}/SoundFileWriterOgg.hpp\n        ${SRCROOT}/SoundFileWriterOgg.cpp\n        ${SRCROOT}/SoundFileWriterWav.hpp\n        ${SRCROOT}/SoundFileWriterWav.cpp\n    )\nendif()''')
          a = a.replace('''sfml_find_package(OpenAL INCLUDE "OPENAL_INCLUDE_DIR" LINK "OPENAL_LIBRARY")\nsfml_find_package(Vorbis INCLUDE "VORBIS_INCLUDE_DIRS" LINK "VORBIS_LIBRARIES")\nsfml_find_package(FLAC INCLUDE "FLAC_INCLUDE_DIR" LINK "FLAC_LIBRARY")''', '''sfml_find_package(OpenAL INCLUDE "OPENAL_INCLUDE_DIR" LINK "OPENAL_LIBRARY")\nsfml_find_package(Vorbis INCLUDE "VORBIS_INCLUDE_DIRS" LINK "VORBIS_LIBRARIES")\nif(NOT SFML_OS_EMSCRIPTEN)\n    sfml_find_package(FLAC INCLUDE "FLAC_INCLUDE_DIR" LINK "FLAC_LIBRARY")\nendif()''')
          a = a.replace('''target_compile_definitions(Vorbis INTERFACE "OV_EXCLUDE_STATIC_CALLBACKS")\ntarget_compile_definitions(FLAC INTERFACE "FLAC__NO_DLL")''', '''target_compile_definitions(Vorbis INTERFACE "OV_EXCLUDE_STATIC_CALLBACKS")\nif(NOT SFML_OS_EMSCRIPTEN)\n    target_compile_definitions(FLAC INTERFACE "FLAC__NO_DLL")\nendif()''')
          a = a.replace('''target_link_libraries(sfml-audio\n                      PUBLIC sfml-system\n                      PRIVATE Vorbis FLAC)''', '''if(SFML_OS_EMSCRIPTEN)\n    target_link_libraries(sfml-audio PUBLIC sfml-system PRIVATE Vorbis)\nelse()\n    target_link_libraries(sfml-audio PUBLIC sfml-system PRIVATE Vorbis FLAC)\nendif()''')
          audio.write_text(a, encoding="utf-8")

          factory = Path("sfml-src/src/SFML/Audio/SoundFileFactory.cpp")
          f = factory.read_text(encoding="utf-8")
          f = f.replace('#include <SFML/Audio/SoundFileReaderFlac.hpp>\n#include <SFML/Audio/SoundFileWriterFlac.hpp>\n', '#ifndef __EMSCRIPTEN__\n#include <SFML/Audio/SoundFileReaderFlac.hpp>\n#include <SFML/Audio/SoundFileWriterFlac.hpp>\n#endif\n')
          f = f.replace('''            sf::SoundFileFactory::registerReader<sf::priv::SoundFileReaderFlac>();\n            sf::SoundFileFactory::registerWriter<sf::priv::SoundFileWriterFlac>();\n''', '''#ifndef __EMSCRIPTEN__\n            sf::SoundFileFactory::registerReader<sf::priv::SoundFileReaderFlac>();\n            sf::SoundFileFactory::registerWriter<sf::priv::SoundFileWriterFlac>();\n#endif\n''')
          factory.write_text(f, encoding="utf-8")
          PY

          emcmake cmake -S sfml-src -B sfml-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sfml-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_BUILD_WINDOW=OFF \
            -DSFML_BUILD_GRAPHICS=OFF \
            -DSFML_BUILD_NETWORK=ON \
            -DSFML_BUILD_AUDIO=ON \
            -DSFML_USE_SYSTEM_DEPS=OFF

          cmake --build sfml-build --parallel 2
          cmake --install sfml-build

          test -f sfml-install/include/SFML/Audio.hpp
          test -f sfml-install/lib/libsfml-system-s.a
          test -f sfml-install/lib/libsfml-audio-s.a
          test -f sfml-install/lib/libsfml-network-s.a

      - name: Prepare Floating Sandbox WebAssembly compatibility layer
        run: |
          set -eux
          test -s wasm-compat/wx/glcanvas.h

          python3 - <<'PY'
          from pathlib import Path
          p = Path("upstream-floating-sandbox/Sources/OpenGLCore/glad/glad.c")
          s = p.read_text(encoding="utf-8")
          marker = '#else\n#include <dlfcn.h>\nstatic void* libGL;'
          if marker not in s:
              raise SystemExit("Could not locate glad dynamic-loader block")
          start = s.index(marker)
          end = s.index("struct gladGLversionStruct GLVersion", start)
          replacement = r'''#else
#ifdef __EMSCRIPTEN__
#include <emscripten/html5_webgl.h>
static void* libGL;
int open_gl(void) { return 1; }
void close_gl(void) { libGL = NULL; }
void* get_proc(const char *namez) { return emscripten_webgl_get_proc_address(namez); }
#else
#include <dlfcn.h>
static void* libGL;
#if !defined(__APPLE__) && !defined(__HAIKU__)
typedef void* (APIENTRYP PFNGLXGETPROCADDRESSPROC_PRIVATE)(const char*);
static PFNGLXGETPROCADDRESSPROC_PRIVATE gladGetProcAddressPtr;
#endif
int open_gl(void) {
#ifdef __APPLE__
    static const char *NAMES[] = {
        "../Frameworks/OpenGL.framework/OpenGL",
        "/Library/Frameworks/OpenGL.framework/OpenGL",
        "/System/Library/Frameworks/OpenGL.framework/OpenGL",
        "/System/Library/Frameworks/OpenGL.framework/Versions/Current/OpenGL"
    };
#else
    static const char *NAMES[] = {"libGL.so.1", "libGL.so"};
#endif
    unsigned int index = 0;
    for(index = 0; index < (sizeof(NAMES) / sizeof(NAMES[0])); index++) {
        libGL = dlopen(NAMES[index], RTLD_NOW | RTLD_GLOBAL);
        if(libGL != NULL) {
#if defined(__APPLE__) || defined(__HAIKU__)
            return 1;
#else
            gladGetProcAddressPtr = (PFNGLXGETPROCADDRESSPROC_PRIVATE)dlsym(libGL, "glXGetProcAddressARB");
            return gladGetProcAddressPtr != NULL;
#endif
        }
    }
    return 0;
}
void close_gl(void) {
    if(libGL != NULL) {
        dlclose(libGL);
        libGL = NULL;
    }
}
void* get_proc(const char *namez) {
    void* result = NULL;
    if(libGL == NULL) return NULL;
#if !defined(__APPLE__) && !defined(__HAIKU__)
    if(gladGetProcAddressPtr != NULL) result = gladGetProcAddressPtr(namez);
#endif
    if(result == NULL) {
#if defined(_WIN32) || defined(__CYGWIN__)
        result = (void*)GetProcAddress((HMODULE) libGL, namez);
#else
        result = dlsym(libGL, namez);
#endif
    }
    return result;
}
#endif

'''
          p.write_text(s[:start] + replacement + s[end:], encoding="utf-8")

          Path("upstream-floating-sandbox/cmake/FindOpenGL.cmake").write_text('''include_guard()\nset(OpenGL_FOUND TRUE)\nset(OPENGL_FOUND TRUE)\nset(OPENGL_LIBRARIES "")\nset(OPENGL_INCLUDE_DIRS "")\nif(NOT TARGET OpenGL::GL)\n  add_library(OpenGL::GL INTERFACE IMPORTED)\nendif()\n''', encoding="utf-8")
          PY

      - name: Configure Emscripten build
        run: |
          set -eux
          rm -rf wasm-port-build
          mkdir -p wasm-port-build

          cat > upstream-floating-sandbox/cmake/FindwxWidgets.cmake <<'CMAKE'
          include(FindPackageHandleStandardArgs)
          if(NOT wxWidgets_CONFIG_EXECUTABLE)
            if(DEFINED ENV{WX_CONFIG} AND EXISTS "$ENV{WX_CONFIG}")
              set(wxWidgets_CONFIG_EXECUTABLE "$ENV{WX_CONFIG}")
            else()
              find_program(wxWidgets_CONFIG_EXECUTABLE NAMES wx-config wx-config-3.1)
            endif()
          endif()

          set(wxWidgets_FOUND FALSE)
          set(wxWidgets_INCLUDE_DIRS "")
          set(wxWidgets_LIBRARIES "")
          set(wxWidgets_LIBRARY_DIRS "")
          set(wxWidgets_CXX_FLAGS "")
          set(wxWidgets_DEFINITIONS "")

          if(wxWidgets_CONFIG_EXECUTABLE)
            execute_process(
              COMMAND "${wxWidgets_CONFIG_EXECUTABLE}" --cxxflags
              OUTPUT_VARIABLE _wx_cxxflags_raw
              ERROR_VARIABLE _wx_cxxflags_err
              RESULT_VARIABLE _wx_cxxflags_ret
              OUTPUT_STRIP_TRAILING_WHITESPACE)
            execute_process(
              COMMAND "${wxWidgets_CONFIG_EXECUTABLE}" --libs base,core,html,propgrid,ribbon
              OUTPUT_VARIABLE _wx_libs_raw
              ERROR_VARIABLE _wx_libs_err
              RESULT_VARIABLE _wx_libs_ret
              OUTPUT_STRIP_TRAILING_WHITESPACE)

            message(STATUS "FindwxWidgets(WASM): cxxflags ret=${_wx_cxxflags_ret} out='${_wx_cxxflags_raw}' err='${_wx_cxxflags_err}'")
            message(STATUS "FindwxWidgets(WASM): libs ret=${_wx_libs_ret} out='${_wx_libs_raw}' err='${_wx_libs_err}'")

            if(_wx_cxxflags_ret EQUAL 0 AND _wx_libs_ret EQUAL 0 AND NOT "${_wx_libs_raw}" STREQUAL "")
              separate_arguments(_wx_cxxflags NATIVE_COMMAND "${_wx_cxxflags_raw}")
              separate_arguments(_wx_libs NATIVE_COMMAND "${_wx_libs_raw}")

              foreach(_arg IN LISTS _wx_cxxflags)
                if(_arg MATCHES "^-I(.+)$")
                  list(APPEND wxWidgets_INCLUDE_DIRS "${CMAKE_MATCH_1}")
                elseif(_arg MATCHES "^-D(.+)$")
                  list(APPEND wxWidgets_DEFINITIONS "${CMAKE_MATCH_1}")
                else()
                  list(APPEND wxWidgets_CXX_FLAGS "${_arg}")
                endif()
              endforeach()

              foreach(_arg IN LISTS _wx_libs)
                if(_arg MATCHES "^-L(.+)$")
                  list(APPEND wxWidgets_LIBRARY_DIRS "${CMAKE_MATCH_1}")
                else()
                  list(APPEND wxWidgets_LIBRARIES "${_arg}")
                endif()
              endforeach()

              set(wxWidgets_FOUND TRUE)
            endif()
          endif()

          find_package_handle_standard_args(wxWidgets
            REQUIRED_VARS wxWidgets_CONFIG_EXECUTABLE wxWidgets_INCLUDE_DIRS wxWidgets_LIBRARIES)
          CMAKE

          emcmake cmake -S upstream-floating-sandbox -B wasm-port-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DFS_USE_STATIC_LIBS=ON \
            -DGTEST_DIR="$GITHUB_WORKSPACE/third-party/googletest" \
            -DPICOJSON_INCLUDE_DIRS="$GITHUB_WORKSPACE/third-party/picojson/include" \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a" \
            -DJPEG_INCLUDE_DIR="$GITHUB_WORKSPACE/jpeg-install/include" \
            -DJPEG_LIBRARY="$GITHUB_WORKSPACE/jpeg-install/lib/libjpeg.a" \
            -DPNG_PNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_LIBRARY="$GITHUB_WORKSPACE/png-install/lib/libpng16.a" \
            -DwxWidgets_ROOT="$GITHUB_WORKSPACE/wxwidgets-install" \
            -DwxWidgets_CONFIG_EXECUTABLE="$WX_CONFIG" \
            -DwxWidgets_USE_DEBUG=OFF \
            -DwxWidgets_USE_UNICODE=ON \
            -DwxWidgets_USE_STATIC=ON \
            -DwxWidgets_USE_UNIVERSAL=ON \
            -DSFML_ROOT="$GITHUB_WORKSPACE/sfml-install" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sfml-install" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/wasm-compat -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sALLOW_MEMORY_GROWTH=1 -sUSE_OPENAL=1 -sUSE_OGG=1 -sUSE_VORBIS=1 -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$GITHUB_WORKSPACE/zlib-install/lib -L$GITHUB_WORKSPACE/png-install/lib -L$GITHUB_WORKSPACE/jpeg-install/lib -L$GITHUB_WORKSPACE/sfml-install/lib -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sALLOW_MEMORY_GROWTH=1 -sUSE_OPENAL=1 -sUSE_OGG=1 -sUSE_VORBIS=1 -pthread"

      - name: Build
        run: |
          set -eux
          cmake --build wasm-port-build --parallel 2

      - name: Collect build output
        if: always()
        run: |
          set -eux
          echo '=== CMake cache ==='
          if [ -f wasm-port-build/CMakeCache.txt ]; then
            grep -E 'CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|PICOJSON|ZLIB|JPEG|PNG|wxWidgets|WX|SFML|OPENGL|OPENAL|VORBIS' wasm-port-build/CMakeCache.txt || true
          fi
          echo '=== WASM/JS/HTML/data output ==='
          if [ -d wasm-port-build ]; then
            find wasm-port-build -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.data' \) -print | sort || true
          fi

      - name: Upload experimental build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-emscripten-port
          path: |
            wasm-port-build/**/*.wasm
            wasm-port-build/**/*.js
            wasm-port-build/**/*.html
            wasm-port-build/**/*.data
            wasm-port-build/CMakeCache.txt
            wasm-port-build/CMakeFiles/**/*.log
          if-no-files-found: ignore
