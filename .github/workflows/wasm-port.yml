name: Experimental Floating Sandbox WebAssembly Port

on:
  workflow_dispatch:
  push:
    branches: [wasm-port]

permissions:
  contents: read

concurrency:
  group: floating-sandbox-wasm-port
  cancel-in-progress: true

jobs:
  emscripten-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.12

      - name: Verify Emscripten toolchain
        run: |
          set -eux
          emcc --version
          em++ --version
          command -v emcmake
          emcmake cmake --version
          cmake --version

      - name: Checkout upstream Floating Sandbox
        run: |
          set -eux
          git clone --depth 1 https://github.com/GabrieleGiuseppini/Floating-Sandbox.git upstream-floating-sandbox

      - name: Install PicoJSON
        run: |
          set -eux
          mkdir -p third-party/picojson/include
          curl -L --fail --retry 3 https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h -o third-party/picojson/include/picojson.h
          test -s third-party/picojson/include/picojson.h

      - name: Build ZLIB for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          mkdir -p zlib-build zlib-install
          emcmake cmake -S zlib-src -B zlib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/zlib-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DZLIB_BUILD_TESTING=OFF
          cmake --build zlib-build --parallel 2
          cmake --install zlib-build
          test -f zlib-install/include/zlib.h
          test -f zlib-install/lib/libz.a

      - name: Build JPEG for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch 3.1.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git jpeg-src
          mkdir -p jpeg-build jpeg-install
          emcmake cmake -S jpeg-src -B jpeg-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/jpeg-install" \
            -DENABLE_SHARED=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_SIMD=OFF
          cmake --build jpeg-build --parallel 2
          cmake --install jpeg-build
          test -f jpeg-install/include/jpeglib.h
          test -f jpeg-install/lib/libjpeg.a

      - name: Build PNG for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git png-src
          mkdir -p png-build png-install
          emcmake cmake -S png-src -B png-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/png-install" \
            -DPNG_SHARED=OFF \
            -DPNG_TESTS=OFF \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a"
          cmake --build png-build --parallel 2
          cmake --install png-build
          test -f png-install/include/png.h
          test -f png-install/lib/libpng16.a

      - name: Build wxWidgets for WebAssembly
        run: |
          set -eux
          git clone --depth 1 https://github.com/ahilss/wxWidgets-wasm.git wxwidgets-src
          cd wxwidgets-src
          git submodule update --init src/jpeg src/zlib src/png src/expat 3rdparty/catch
          test -f src/zlib/zlib.h
          test -f src/png/png.c
          test -f src/expat/expat/lib/expat.h
          test -f config.sub
          test -f config.guess
          test -f src/expat/expat/conftools/config.sub
          test -f src/expat/expat/conftools/config.guess
          cp config.sub src/expat/expat/conftools/config.sub
          cp config.guess src/expat/expat/conftools/config.guess
          chmod +x src/expat/expat/conftools/config.sub src/expat/expat/conftools/config.guess
          export CFLAGS="-I$GITHUB_WORKSPACE/zlib-install/include -I$GITHUB_WORKSPACE/png-install/include"
          export CXXFLAGS="-I$GITHUB_WORKSPACE/zlib-install/include -I$GITHUB_WORKSPACE/png-install/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/zlib-install/lib -L$GITHUB_WORKSPACE/png-install/lib -sERROR_ON_UNDEFINED_SYMBOLS=0"
          emconfigure ./configure \
            --host=emscripten \
            --prefix="$GITHUB_WORKSPACE/wxwidgets-install" \
            --with-cxx=14 \
            --enable-utf8 \
            --enable-universal \
            --disable-shared \
            --disable-exceptions \
            --disable-richtext \
            --without-libtiff \
            --disable-xlocale \
            --with-zlib=sys \
            --with-libpng=sys
          emmake make -j2
          emmake make install
          WX_CONFIG=$(find "$GITHUB_WORKSPACE/wxwidgets-install" -type f -name 'wx-config*' -print -quit)
          test -n "$WX_CONFIG"
          chmod +x "$WX_CONFIG"
          echo "WX_CONFIG=$WX_CONFIG" >> "$GITHUB_ENV"
          echo "$(dirname "$WX_CONFIG")" >> "$GITHUB_PATH"

      - name: Verify wxWidgets installation
        run: |
          set -eux
          test -n "$WX_CONFIG"
          test -f "$WX_CONFIG"
          wx-config --version
          wx-config --cxxflags
          wx-config --libs
          for combo in "base" "base,core" "base,core,html" "base,core,propgrid" "base,core,ribbon" "base,core,gl" "base,core,html,propgrid,ribbon"; do
            echo "--- wx-config --libs $combo ---"
            wx-config --libs "$combo" || true
          done

      - name: Build SFML 2.5.1 for WebAssembly
        run: |
          set -eux
          git clone --depth 1 --branch 2.5.1 https://github.com/SFML/SFML.git sfml-src
          python3 - <<'PY'
          p = "sfml-src/cmake/Config.cmake"
          s = open(p, encoding="utf-8").read()
          marker = 'elseif(${CMAKE_SYSTEM_NAME} STREQUAL "Darwin")'
          insert = '''elseif(${CMAKE_SYSTEM_NAME} STREQUAL "Emscripten")
              set(SFML_OS_UNIX 1)
              set(SFML_OS_LINUX 1)
              set(OPENGL_ES 1)
          '''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          mkdir -p sfml-build sfml-install
          emcmake cmake -S sfml-src -B sfml-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sfml-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_BUILD_WINDOW=OFF \
            -DSFML_BUILD_GRAPHICS=OFF \
            -DSFML_BUILD_NETWORK=OFF \
            -DSFML_BUILD_AUDIO=ON \
            -DSFML_USE_SYSTEM_DEPS=OFF
          cmake --build sfml-build --parallel 2
          cmake --install sfml-build
          test -f sfml-install/include/SFML/Audio.hpp
          test -f sfml-install/lib/libsfml-system-s.a
          test -f sfml-install/lib/libsfml-audio-s.a

      - name: Checkout GoogleTest sources
        run: |
          set -eux
          git clone --depth 1 --branch release-1.12.1 https://github.com/google/googletest.git third-party/googletest
          test -d third-party/googletest/googletest

      - name: Prepare Floating Sandbox WebAssembly compatibility layer
        run: |
          set -eux
          test -f wasm-compat/wx/glcanvas.h
          test -s wasm-compat/wx/glcanvas.h
          python3 - <<'PY'
          p = "upstream-floating-sandbox/Sources/OpenGLCore/glad/glad.c"
          s = open(p, encoding="utf-8").read()
          start = s.index("#else\n#include <dlfcn.h>\nstatic void* libGL;")
          end = s.index("struct gladGLversionStruct GLVersion", start)
          replacement = r'''#else
#ifdef __EMSCRIPTEN__
#include <emscripten/html5_webgl.h>
static void* libGL;
int open_gl(void) { return 1; }
void close_gl(void) {}
void* get_proc(const char *namez) { return emscripten_webgl_get_proc_address(namez); }
#else
#include <dlfcn.h>
static void* libGL;
#if !defined(__APPLE__) && !defined(__HAIKU__)
typedef void* (APIENTRYP PFNGLXGETPROCADDRESSPROC_PRIVATE)(const char*);
static PFNGLXGETPROCADDRESSPROC_PRIVATE gladGetProcAddressPtr;
#endif
int open_gl(void) {
#ifdef __APPLE__
    static const char *NAMES[] = {
        "../Frameworks/OpenGL.framework/OpenGL",
        "/Library/Frameworks/OpenGL.framework/OpenGL",
        "/System/Library/Frameworks/OpenGL.framework/OpenGL",
        "/System/Library/Frameworks/OpenGL.framework/Versions/Current/OpenGL"
    };
#else
    static const char *NAMES[] = {"libGL.so.1", "libGL.so"};
#endif
    unsigned int index = 0;
    for(index = 0; index < (sizeof(NAMES) / sizeof(NAMES[0])); index++) {
        libGL = dlopen(NAMES[index], RTLD_NOW | RTLD_GLOBAL);
        if(libGL != NULL) {
#if defined(__APPLE__) || defined(__HAIKU__)
            return 1;
#else
            gladGetProcAddressPtr = (PFNGLXGETPROCADDRESSPROC_PRIVATE)dlsym(libGL, "glXGetProcAddressARB");
            return gladGetProcAddressPtr != NULL;
#endif
        }
    }
    return 0;
}
void close_gl(void) {
    if(libGL != NULL) {
        dlclose(libGL);
        libGL = NULL;
    }
}
void* get_proc(const char *namez) {
    void* result = NULL;
    if(libGL == NULL) return NULL;
#if !defined(__APPLE__) && !defined(__HAIKU__)
    if(gladGetProcAddressPtr != NULL) result = gladGetProcAddressPtr(namez);
#endif
    if(result == NULL) {
#if defined(_WIN32) || defined(__CYGWIN__)
        result = (void*)GetProcAddress((HMODULE) libGL, namez);
#else
        result = dlsym(libGL, namez);
#endif
    }
    return result;
}
#endif

'''
          s = s[:start] + replacement + s[end:]
          open(p, "w", encoding="utf-8").write(s)
          PY

          cat > upstream-floating-sandbox/cmake/FindOpenGL.cmake <<'CMAKE'
          include_guard()
          set(OpenGL_FOUND TRUE)
          set(OPENGL_FOUND TRUE)
          set(OPENGL_LIBRARIES "")
          set(OPENGL_INCLUDE_DIRS "")
          if(NOT TARGET OpenGL::GL)
            add_library(OpenGL::GL INTERFACE IMPORTED)
          endif()
          CMAKE

      - name: Configure Emscripten build
        run: |
          set -eux
          rm -rf wasm-port-build
          mkdir -p wasm-port-build
          test -n "$WX_CONFIG"

          cat > upstream-floating-sandbox/cmake/FindwxWidgets.cmake <<'CMAKE'
          include(FindPackageHandleStandardArgs)
          if(NOT wxWidgets_CONFIG_EXECUTABLE)
            if(DEFINED ENV{WX_CONFIG} AND EXISTS "$ENV{WX_CONFIG}")
              set(wxWidgets_CONFIG_EXECUTABLE "$ENV{WX_CONFIG}")
            else()
              find_program(wxWidgets_CONFIG_EXECUTABLE NAMES wx-config wx-config-3.1)
            endif()
          endif()
          set(wxWidgets_FOUND FALSE)
          set(wxWidgets_INCLUDE_DIRS "")
          set(wxWidgets_LIBRARIES "")
          set(wxWidgets_LIBRARY_DIRS "")
          set(wxWidgets_CXX_FLAGS "")
          set(wxWidgets_DEFINITIONS "")
          if(wxWidgets_CONFIG_EXECUTABLE)
            execute_process(COMMAND "${wxWidgets_CONFIG_EXECUTABLE}" --cxxflags OUTPUT_VARIABLE _wx_cxxflags_raw RESULT_VARIABLE _wx_cxxflags_ret OUTPUT_STRIP_TRAILING_WHITESPACE ERROR_QUIET)
            execute_process(COMMAND "${wxWidgets_CONFIG_EXECUTABLE}" --libs OUTPUT_VARIABLE _wx_libs_raw RESULT_VARIABLE _wx_libs_ret OUTPUT_STRIP_TRAILING_WHITESPACE ERROR_QUIET)
            if(_wx_cxxflags_ret EQUAL 0 AND _wx_libs_ret EQUAL 0)
              separate_arguments(_wx_cxxflags NATIVE_COMMAND "${_wx_cxxflags_raw}")
              separate_arguments(_wx_libs NATIVE_COMMAND "${_wx_libs_raw}")
              foreach(_arg IN LISTS _wx_cxxflags)
                if(_arg MATCHES "^-I(.+)$")
                  list(APPEND wxWidgets_INCLUDE_DIRS "${CMAKE_MATCH_1}")
                elseif(_arg MATCHES "^-D(.+)$")
                  list(APPEND wxWidgets_DEFINITIONS "${CMAKE_MATCH_1}")
                else()
                  list(APPEND wxWidgets_CXX_FLAGS "${_arg}")
                endif()
              endforeach()
              foreach(_arg IN LISTS _wx_libs)
                if(_arg MATCHES "^-L(.+)$")
                  list(APPEND wxWidgets_LIBRARY_DIRS "${CMAKE_MATCH_1}")
                else()
                  list(APPEND wxWidgets_LIBRARIES "${_arg}")
                endif()
              endforeach()
              set(wxWidgets_FOUND TRUE)
            endif()
          endif()
          find_package_handle_standard_args(wxWidgets REQUIRED_VARS wxWidgets_CONFIG_EXECUTABLE wxWidgets_INCLUDE_DIRS wxWidgets_LIBRARIES)
          CMAKE

          emcmake cmake -S upstream-floating-sandbox -B wasm-port-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DFS_USE_STATIC_LIBS=ON \
            -DGTEST_DIR="$GITHUB_WORKSPACE/third-party/googletest" \
            -DPICOJSON_INCLUDE_DIRS="$GITHUB_WORKSPACE/third-party/picojson/include" \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a" \
            -DJPEG_INCLUDE_DIR="$GITHUB_WORKSPACE/jpeg-install/include" \
            -DJPEG_LIBRARY="$GITHUB_WORKSPACE/jpeg-install/lib/libjpeg.a" \
            -DPNG_PNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_LIBRARY="$GITHUB_WORKSPACE/png-install/lib/libpng16.a" \
            -DwxWidgets_ROOT="$GITHUB_WORKSPACE/wxwidgets-install" \
            -DwxWidgets_CONFIG_EXECUTABLE="$WX_CONFIG" \
            -DwxWidgets_USE_DEBUG=OFF \
            -DwxWidgets_USE_UNICODE=ON \
            -DwxWidgets_USE_STATIC=ON \
            -DSFML_ROOT="$GITHUB_WORKSPACE/sfml-install" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sfml-install" \
            -DCMAKE_CXX_FLAGS="-I$GITHUB_WORKSPACE/wasm-compat -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sOFFSCREENCANVAS_SUPPORT=1 -sALLOW_MEMORY_GROWTH=1 -pthread" \
            -DCMAKE_EXE_LINKER_FLAGS="-sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sOFFSCREENCANVAS_SUPPORT=1 -sALLOW_MEMORY_GROWTH=1 -pthread"

      - name: Build
        run: |
          set -eux
          cmake --build wasm-port-build --parallel 2

      - name: Collect build output
        if: always()
        run: |
          set -eux
          echo '=== CMake cache ==='
          if [ -f wasm-port-build/CMakeCache.txt ]; then
            grep -E 'CMAKE_CXX_COMPILER|CMAKE_C_COMPILER|PICOJSON|ZLIB|JPEG|PNG|wxWidgets|WX|SFML|OpenGL' wasm-port-build/CMakeCache.txt || true
          fi
          echo '=== WASM/JS output ==='
          if [ -d wasm-port-build ]; then
            find wasm-port-build -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.data' \) -print | sort || true
          fi

      - name: Upload experimental build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-emscripten-port-diagnostics
          path: |
            wasm-port-build/CMakeCache.txt
            wasm-port-build/CMakeFiles/**/*.log
            wasm-port-build/**/*.wasm
            wasm-port-build/**/*.js
            wasm-port-build/**/*.html
            wasm-port-build/**/*.data
          if-no-files-found: ignore
