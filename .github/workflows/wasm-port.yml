name: Floating Sandbox WebAssembly Port

on:
  workflow_dispatch:
  push:
    branches: [wasm-port-next]

permissions:
  contents: read

concurrency:
  group: floating-sandbox-wasm-port-next
  cancel-in-progress: true

jobs:
  emscripten-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 3.1.12

      - name: Verify Emscripten
        run: |
          set -eux
          emcc --version
          em++ --version
          command -v emcmake
          emcmake cmake --version

      - name: Checkout Floating Sandbox
        run: |
          set -eux
          git clone --depth 1 https://github.com/GabrieleGiuseppini/Floating-Sandbox.git upstream-floating-sandbox

      - name: Install PicoJSON
        run: |
          set -eux
          mkdir -p third-party/picojson/include
          curl -L --fail --retry 3 https://raw.githubusercontent.com/kazuho/picojson/master/picojson.h -o third-party/picojson/include/picojson.h

      - name: Build ZLIB
        run: |
          set -eux
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git zlib-src
          emcmake cmake -S zlib-src -B zlib-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/zlib-install" -DBUILD_SHARED_LIBS=OFF -DZLIB_BUILD_TESTING=OFF
          cmake --build zlib-build --target zlibstatic --parallel 2
          cmake --install zlib-build
          mkdir -p zlib-install/include zlib-install/lib
          cp zlib-src/zlib.h zlib-install/include/zlib.h
          cp zlib-build/zconf.h zlib-install/include/zconf.h
          cp zlib-build/libz.a zlib-install/lib/libz.a

      - name: Build JPEG
        run: |
          set -eux
          git clone --depth 1 --branch 3.1.1 https://github.com/libjpeg-turbo/libjpeg-turbo.git jpeg-src
          emcmake cmake -S jpeg-src -B jpeg-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/jpeg-install" -DENABLE_SHARED=OFF -DWITH_TURBOJPEG=OFF -DWITH_SIMD=OFF
          cmake --build jpeg-build --parallel 2
          cmake --install jpeg-build

      - name: Build PNG
        run: |
          set -eux
          git clone --depth 1 --branch v1.6.50 https://github.com/pnggroup/libpng.git png-src
          emcmake cmake -S png-src -B png-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/png-install" -DPNG_SHARED=OFF -DPNG_TESTS=OFF -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a"
          cmake --build png-build --parallel 2
          cmake --install png-build

      - name: Build wxWidgets for WebAssembly
        run: |
          set -eux
          git clone --depth 1 https://github.com/ahilss/wxWidgets-wasm.git wxwidgets-src
          cd wxwidgets-src
          git submodule update --init src/jpeg src/zlib src/png src/expat 3rdparty/catch
          cp config.sub src/expat/expat/conftools/config.sub
          cp config.guess src/expat/expat/conftools/config.guess
          chmod +x src/expat/expat/conftools/config.sub src/expat/expat/conftools/config.guess
          export CFLAGS="-I$GITHUB_WORKSPACE/zlib-install/include -I$GITHUB_WORKSPACE/png-install/include"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$GITHUB_WORKSPACE/zlib-install/lib -L$GITHUB_WORKSPACE/png-install/lib -sERROR_ON_UNDEFINED_SYMBOLS=0"
          emconfigure ./configure --host=emscripten --prefix="$GITHUB_WORKSPACE/wxwidgets-install" --with-cxx=14 --enable-utf8 --enable-universal --disable-shared --disable-exceptions --disable-richtext --without-libtiff --disable-xlocale --with-zlib=sys --with-libpng=sys
          emmake make -j2
          emmake make install
          WX_CONFIG=$(find "$GITHUB_WORKSPACE/wxwidgets-install" -type f -name 'wx-config*' -print -quit)
          test -n "$WX_CONFIG"
          chmod +x "$WX_CONFIG"
          echo "WX_CONFIG=$WX_CONFIG" >> "$GITHUB_ENV"
          echo "$(dirname "$WX_CONFIG")" >> "$GITHUB_PATH"

      - name: Verify wxWidgets
        run: |
          set -eux
          wx-config --version
          wx-config --libs base,core,html,propgrid,ribbon

      - name: Verify Emscripten audio ports
        run: |
          set -eux
          cat >/tmp/audio-probe.cpp <<'CPP'
          #include <AL/al.h>
          #include <vorbis/vorbisfile.h>
          int main() { return AL_NO_ERROR; }
          CPP
          em++ /tmp/audio-probe.cpp -sUSE_OGG=1 -sUSE_VORBIS=1 -lopenal -o /tmp/audio-probe.js
          test -s /tmp/audio-probe.js

      - name: Build SFML WebAssembly
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 2.6.x-EMCC https://github.com/Zombieschannel/SFML.git sfml-src
          export CFLAGS="-D__EMSCRIPTEN__"
          export CXXFLAGS="-D__EMSCRIPTEN__ -fexceptions -pthread"
          export LDFLAGS="-pthread -sUSE_OGG=1 -sUSE_VORBIS=1 -lopenal"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sfml-src/cmake/Config.cmake')
          s = p.read_text(encoding='utf-8')
          s = s.replace('--use-port=freetype', '')
          s = s.replace('--use-port=ogg', '-sUSE_OGG=1')
          s = s.replace('--use-port=vorbis', '-sUSE_VORBIS=1')
          s = s.replace('-SMINIFY_HTML=1', '-sMINIFY_HTML=1')
          p.write_text(s, encoding='utf-8')
          assert 'set(SFML_OS_EMSCRIPTEN 1)' in s
          assert '--use-port=' not in s
          assert '-sUSE_OGG=1' in s
          assert '-sUSE_VORBIS=1' in s
          print('SFML Emscripten CMake configuration verified')
          PY
          emcmake cmake -S sfml-src -B sfml-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sfml-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DSFML_BUILD_WINDOW=OFF \
            -DSFML_BUILD_GRAPHICS=OFF \
            -DSFML_BUILD_AUDIO=ON \
            -DSFML_BUILD_NETWORK=ON \
            -DSFML_BUILD_TEST_SUITE=OFF
          cmake --build sfml-build --parallel 2 2>&1 | tee sfml-build.log
          cmake --install sfml-build 2>&1 | tee sfml-install.log
          test -f sfml-install/include/SFML/Audio.hpp
          test -f sfml-install/lib/libsfml-system-s.a
          test -f sfml-install/lib/libsfml-network-s.a
          test -f sfml-install/lib/libsfml-audio-s.a

      - name: Checkout GoogleTest
        run: |
          set -eux
          git clone --depth 1 --branch release-1.12.1 https://github.com/google/googletest.git third-party/googletest

      - name: Prepare Floating Sandbox WebAssembly compatibility
        run: |
          set -eux
          python3 -m py_compile wasm-compat/prepare_floating_sandbox.py
          python3 wasm-compat/prepare_floating_sandbox.py

      - name: Configure Floating Sandbox
        run: |
          set -eux
          rm -rf wasm-port-build
          export CXXFLAGS="$(wx-config --cxxflags) -I$GITHUB_WORKSPACE/wasm-compat -fexceptions -pthread -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sALLOW_MEMORY_GROWTH=1 -sUSE_OGG=1 -sUSE_VORBIS=1"
          export LDFLAGS="-L$GITHUB_WORKSPACE/zlib-install/lib -L$GITHUB_WORKSPACE/png-install/lib -L$GITHUB_WORKSPACE/jpeg-install/lib -L$GITHUB_WORKSPACE/sfml-install/lib -fexceptions -pthread -sDISABLE_EXCEPTION_CATCHING=0 -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -sALLOW_MEMORY_GROWTH=1 -sUSE_OGG=1 -sUSE_VORBIS=1 -lopenal"
          emcmake cmake -S upstream-floating-sandbox -B wasm-port-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFS_BUILD_BENCHMARKS=OFF \
            -DFS_USE_STATIC_LIBS=ON \
            -DGTEST_DIR="$GITHUB_WORKSPACE/third-party/googletest" \
            -DPICOJSON_INCLUDE_DIRS="$GITHUB_WORKSPACE/third-party/picojson/include" \
            -DZLIB_ROOT="$GITHUB_WORKSPACE/zlib-install" \
            -DZLIB_INCLUDE_DIR="$GITHUB_WORKSPACE/zlib-install/include" \
            -DZLIB_LIBRARY="$GITHUB_WORKSPACE/zlib-install/lib/libz.a" \
            -DJPEG_INCLUDE_DIR="$GITHUB_WORKSPACE/jpeg-install/include" \
            -DJPEG_LIBRARY="$GITHUB_WORKSPACE/jpeg-install/lib/libjpeg.a" \
            -DPNG_PNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_INCLUDE_DIR="$GITHUB_WORKSPACE/png-install/include" \
            -DPNG_LIBRARY="$GITHUB_WORKSPACE/png-install/lib/libpng16.a" \
            -DwxWidgets_ROOT="$GITHUB_WORKSPACE/wxwidgets-install" \
            -DwxWidgets_CONFIG_EXECUTABLE="$WX_CONFIG" \
            -DwxWidgets_USE_DEBUG=OFF \
            -DwxWidgets_USE_UNICODE=ON \
            -DwxWidgets_USE_STATIC=ON \
            -DSFML_ROOT="$GITHUB_WORKSPACE/sfml-install" \
            -DSFML_DIR="$GITHUB_WORKSPACE/sfml-install/lib/cmake/SFML" \
            -DSFML_STATIC_LIBRARIES=TRUE \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/sfml-install"

      - name: Build Floating Sandbox
        run: |
          set -eux
          cmake --build wasm-port-build --parallel 2

      - name: Collect WebAssembly output
        if: always()
        run: |
          set -eux
          mkdir -p wasm-artifact
          if [ -d wasm-port-build ]; then
            find wasm-port-build -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.html' -o -name '*.data' \) -exec cp --parents {} wasm-artifact/ \; || true
          fi
          cp -f sfml-build.log sfml-install.log wasm-artifact/ 2>/dev/null || true

      - name: Upload WebAssembly build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floating-sandbox-emscripten-port
          path: wasm-artifact
          if-no-files-found: warn
