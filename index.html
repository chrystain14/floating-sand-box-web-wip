<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating Sandbox Web</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:white;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080d;z-index:10}
#loading-content{text-align:center}
#game{display:block;width:100%;height:100%;background:#000}
#status{opacity:.7;margin-top:10px}
</style>
</head>
<body>
<div id="loading"><div id="loading-content"><h1>🚢 Floating Sandbox Web</h1><div id="status">Loading WebAssembly...</div></div></div>
<canvas id="game" tabindex="0"></canvas>
<script type="module">
const canvas=document.getElementById("game");
const loading=document.getElementById("loading");
const status=document.getElementById("status");
try {
    const module=await import("./floating-sandbox-web.js");
    const factory=module.default||module;
    if(typeof factory==="function") {
        await factory({canvas});
    }
    status.textContent="WebAssembly initialized.";
    loading.style.display="none";
} catch(error) {
    console.error(error);
    status.textContent="WebAssembly failed to load.";
}
</script>
</body>
</html>
